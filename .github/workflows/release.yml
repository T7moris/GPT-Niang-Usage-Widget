name: Test and publish Windows and macOS release

on:
  push:
    branches: [main]
    paths:
      - gpt-niang-usage/package.json
      - gpt-niang-usage/.codex-plugin/plugin.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - script/**
      - gpt-niang-usage/package.json
      - gpt-niang-usage/.codex-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node runtime tests
        working-directory: gpt-niang-usage
        run: npm test
      - name: Prepare isolated installer executable fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'gpt-niang-test-bin'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $fixture 'codex.exe')
          $fixture | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows installer, lifecycle and WPF tests
        working-directory: gpt-niang-usage
        run: npm run test:windows
      - name: Build and verify Windows bundle
        run: python scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*-windows.zip
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node runtime and crash recovery tests
        working-directory: gpt-niang-usage
        run: npm test
      - name: Swift behavior tests
        run: swift test --package-path macos
      - name: Build universal release app
        env:
          GPT_NIANG_BUILD_CONFIGURATION: release
          GPT_NIANG_BUILD_UNIVERSAL: '1'
        run: ./script/build_and_run.sh --build-only
      - name: Verify architectures, version, signature and archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./gpt-niang-usage/package.json').version")"
          lipo dist/GPTNiangMac.app/Contents/MacOS/GPTNiangMac -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/GPTNiangMac.app/Contents/Info.plist)" = "$version"
          codesign --verify --deep --strict dist/GPTNiangMac.app
          archive="dist/gpt-niang-usage-widget-v$version-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/GPTNiangMac.app "$archive"
          mkdir -p "$RUNNER_TEMP/mac-release-check"
          ditto -x -k "$archive" "$RUNNER_TEMP/mac-release-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/mac-release-check/GPTNiangMac.app"
          lipo "$RUNNER_TEMP/mac-release-check/GPTNiangMac.app/Contents/MacOS/GPTNiangMac" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*-macos-universal.zip
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify both packages and prepare checksums and release notes
        run: python scripts/prepare-release.py
      - name: Publish both platform packages together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("gpt-niang-usage/package.json"))["version"])')"
          tag="v$version"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "$tag" '.[] | select(.tagName == $tag)' "$RUNNER_TEMP/releases.json" >/dev/null; then
            echo "Release $tag already exists; increment the version first." >&2
            exit 1
          fi
          gh release create "$tag" dist/*-windows.zip dist/*-macos-universal.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag · Windows / macOS" --notes-file dist/release-notes.md --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
